# Release workflow — cuts a GitHub Release from a version tag.
#
# How to cut a release:
#   1. From a clean main branch:  git tag v0.1.0
#   2. Push the tag:              git push origin v0.1.0
#   3. This workflow triggers on the tag, runs GoReleaser (`release --clean`),
#      and publishes a GitHub Release with the built binaries (linux/darwin/
#      windows × amd64/arm64), the checksums file, and the auto-generated
#      changelog.
#
# Rolling major tags: after the first release exists, create the `v1` tag
# (git tag v1 && git push origin v1) so downstream references such as
# `JayveerPrajapati/blueprint/.github/actions/blueprint-ci@v1` resolve.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so GoReleaser can build the changelog from the tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}